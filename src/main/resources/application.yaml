
server:
  port: 9642
  servlet:
    context-path: /agri-drone-management-system

spring:
  application:
    name: Agri-Drone-Management-System-Back-End

  datasource:
    #url: jdbc:h2:mem:testdb
    url: jdbc:h2:file:./data/agri-drone-management-system-db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true


logging:
  file:
    name: logs/agri-drone.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      file-name-pattern: logs/archived/agri-drone-%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30
      total-size-cap: 1GB
  level:
    root: INFO
    com.agri_drone_management_system_back_end: DEBUG